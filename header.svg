<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Arnav Paniya, ECE student</title>
  <desc id="d">A circuit board where a chip routes copper traces into a browser window showing the name Arnav Paniya.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1D4670"/>
    </pattern>
  </defs>
  <style>
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    @media (prefers-reduced-motion: reduce){.pulse{display:none}}
  </style>

  <rect width="1200" height="390" rx="16" fill="#0E2A47"/>
  <rect width="1200" height="390" rx="16" fill="url(#dots)"/>

  <!-- chip -->
  <g fill="#D9A441">
    <rect x="58" y="131" width="12" height="8"/><rect x="58" y="151" width="12" height="8"/>
    <rect x="58" y="171" width="12" height="8"/><rect x="58" y="191" width="12" height="8"/>
    <rect x="58" y="211" width="12" height="8"/>
    <rect x="230" y="131" width="12" height="8"/><rect x="230" y="151" width="12" height="8"/>
    <rect x="230" y="171" width="12" height="8"/><rect x="230" y="191" width="12" height="8"/>
    <rect x="230" y="211" width="12" height="8"/>
    <rect x="96" y="83" width="8" height="12"/><rect x="121" y="83" width="8" height="12"/>
    <rect x="146" y="83" width="8" height="12"/><rect x="171" y="83" width="8" height="12"/>
    <rect x="196" y="83" width="8" height="12"/>
    <rect x="96" y="235" width="8" height="12"/><rect x="121" y="235" width="8" height="12"/>
    <rect x="146" y="235" width="8" height="12"/><rect x="171" y="235" width="8" height="12"/>
    <rect x="196" y="235" width="8" height="12"/>
  </g>
  <rect x="70" y="95" width="160" height="140" rx="6" fill="#0A1E34" stroke="#D9A441" stroke-width="2"/>
  <circle cx="86" cy="111" r="4" fill="none" stroke="#D9A441" stroke-width="1.5"/>
  <text x="150" y="170" text-anchor="middle" class="serif" font-size="34" font-weight="700" fill="#D9A441">ECE</text>
  <text x="150" y="196" text-anchor="middle" class="mono" font-size="11" fill="#F3EFE6" fill-opacity=".75">silicon + web</text>
  <text x="70" y="72" class="mono" font-size="11" fill="#F3EFE6" fill-opacity=".6">U1</text>

  <!-- traces -->
  <g fill="none" stroke="#D9A441" stroke-width="3" stroke-linejoin="round">
    <path id="t1" d="M242,135 H280 L310,105 H640"/>
    <path id="t2" d="M242,155 H340 L360,135 H640"/>
    <path id="t3" d="M242,175 H640"/>
    <path id="t4" d="M242,195 H340 L360,215 H640"/>
    <path id="t5" d="M242,215 H280 L310,245 H640"/>
  </g>
  <g fill="#0E2A47" stroke="#D9A441" stroke-width="2.5">
    <circle cx="640" cy="105" r="5"/><circle cx="640" cy="135" r="5"/><circle cx="640" cy="175" r="5"/>
    <circle cx="640" cy="215" r="5"/><circle cx="640" cy="245" r="5"/>
  </g>

  <!-- signal pulses -->
  <g fill="#5CE1E6">
    <circle class="pulse" r="4.5" opacity="0"><animateMotion dur="3.2s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#t1"/></animateMotion><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle class="pulse" r="4.5" opacity="0"><animateMotion dur="3.2s" begin="0.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#t2"/></animateMotion><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle class="pulse" r="4.5" opacity="0"><animateMotion dur="3.2s" begin="1s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#t3"/></animateMotion><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="3.2s" begin="1s" repeatCount="indefinite"/></circle>
    <circle class="pulse" r="4.5" opacity="0"><animateMotion dur="3.2s" begin="1.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#t4"/></animateMotion><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="3.2s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle class="pulse" r="4.5" opacity="0"><animateMotion dur="3.2s" begin="2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#t5"/></animateMotion><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="3.2s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- browser window -->
  <rect x="640" y="60" width="490" height="220" rx="10" fill="#F3EFE6"/>
  <path d="M640,70 a10,10 0 0 1 10,-10 h470 a10,10 0 0 1 10,10 v22 h-490z" fill="#D8D2C4"/>
  <circle cx="662" cy="76" r="4.5" fill="#0E2A47" fill-opacity=".35"/>
  <circle cx="680" cy="76" r="4.5" fill="#0E2A47" fill-opacity=".35"/>
  <circle cx="698" cy="76" r="4.5" fill="#0E2A47" fill-opacity=".35"/>
  <rect x="730" y="67" width="270" height="18" rx="9" fill="#F3EFE6"/>
  <text x="744" y="80" class="mono" font-size="11" fill="#3A5673">arnavpaniya.netlify.app</text>

  <text x="672" y="150" class="serif" font-size="46" font-weight="700" fill="#0E2A47">Arnav Paniya</text>
  <text x="672" y="182" class="sans" font-size="18" fill="#3A5673">ECE student. From silicon to screen.</text>

  <g fill="none" stroke="#0E2A47" stroke-width="1.5">
    <rect x="672" y="203" width="70" height="26" rx="13"/>
    <rect x="752" y="203" width="70" height="26" rx="13"/>
    <rect x="832" y="203" width="112" height="26" rx="13"/>
    <rect x="954" y="203" width="50" height="26" rx="13"/>
  </g>
  <g class="mono" font-size="12" fill="#0E2A47" text-anchor="middle">
    <text x="707" y="220">VLSI</text><text x="787" y="220">FPGA</text>
    <text x="888" y="220">TypeScript</text><text x="979" y="220">AI</text>
  </g>
  <rect x="672" y="247" width="300" height="6" rx="3" fill="#D8D2C4"/>
  <rect x="672" y="259" width="200" height="6" rx="3" fill="#D8D2C4"/>

  <!-- testbench waveform -->
  <g class="mono" font-size="11" fill="#F3EFE6" fill-opacity=".6">
    <text x="70" y="310">clk</text><text x="70" y="332">req</text><text x="70" y="354">ack</text>
  </g>
  <g fill="none" stroke="#F3EFE6" stroke-opacity=".75" stroke-width="1.8" stroke-linejoin="miter">
    <path d="M110,312 H130 V300 H150 V312 H170 V300 H190 V312 H210 V300 H230 V312 H250 V300 H270 V312 H290 V300 H310 V312 H330 V300 H350 V312 H370 V300 H390 V312 H410 V300 H430 V312 H450 V300 H470 V312 H490 V300 H510 V312 H530 V300 H550 V312 H570 V300 H590"/>
    <path d="M110,334 H150 V322 H250 V334 H350 V322 H450 V334 H590" stroke="#D9A441" stroke-opacity="1"/>
    <path d="M110,356 H190 V344 H290 V356 H390 V344 H490 V356 H590" stroke="#D9A441" stroke-opacity="1"/>
  </g>
  <line class="pulse" x1="110" y1="292" x2="110" y2="362" stroke="#5CE1E6" stroke-width="2" stroke-opacity=".8">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="480 0" dur="8s" repeatCount="indefinite"/>
  </line>
  <text x="640" y="326" class="mono" font-size="14" fill="#D9A441">assert (hardware &amp;&amp; web);</text>
  <text x="640" y="348" class="mono" font-size="12" fill="#5CE1E6" fill-opacity=".85">// scoreboard: match</text>
  <text x="640" y="372" class="mono" font-size="11" fill="#F3EFE6" fill-opacity=".5">arnav paniya / rev b</text>
</svg>
