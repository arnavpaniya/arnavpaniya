<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Signal chain from silicon to interface</title>
<desc id="d">Four blocks left to right: Silicon, Embedded, Backend, Interface. The first two are hardware, the last two are software.</desc>
<style>.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}.serif{font-family:Georgia,'Times New Roman',serif}@media (prefers-reduced-motion: reduce){.pulse{display:none}}</style>
<rect width="1200" height="250" rx="16" fill="#0E2A47"/>
<g stroke="#D9A441" stroke-width="2" fill="none"><path d="M45,52 V40 H575 V52"/></g>
<g stroke="#5CE1E6" stroke-width="2" fill="none"><path d="M625,52 V40 H1155 V52"/></g>
<text x="310" y="30" text-anchor="middle" class="mono" font-size="13" fill="#D9A441">hardware</text>
<text x="890" y="30" text-anchor="middle" class="mono" font-size="13" fill="#5CE1E6">software</text>
<rect x="45" y="70" width="240" height="140" rx="8" fill="#0A1E34" stroke="#D9A441" stroke-width="2"/>
<text x="65" y="108" class="serif" font-size="24" font-weight="700" fill="#F3EFE6">Silicon</text>
<text x="65" y="138" class="mono" font-size="14" fill="#F3EFE6" fill-opacity=".8">RTL design</text>
<text x="65" y="162" class="mono" font-size="14" fill="#F3EFE6" fill-opacity=".8">Xilinx FPGA</text>
<text x="65" y="186" class="mono" font-size="14" fill="#F3EFE6" fill-opacity=".8">SoC flow</text>
<rect x="335" y="70" width="240" height="140" rx="8" fill="#0A1E34" stroke="#D9A441" stroke-width="2"/>
<text x="355" y="108" class="serif" font-size="24" font-weight="700" fill="#F3EFE6">Embedded</text>
<text x="355" y="138" class="mono" font-size="14" fill="#F3EFE6" fill-opacity=".8">ESP32 nodes</text>
<text x="355" y="162" class="mono" font-size="14" fill="#F3EFE6" fill-opacity=".8">UAV systems</text>
<text x="355" y="186" class="mono" font-size="14" fill="#F3EFE6" fill-opacity=".8">Sensor data</text>
<rect x="625" y="70" width="240" height="140" rx="8" fill="#0A1E34" stroke="#5CE1E6" stroke-width="2"/>
<text x="645" y="108" class="serif" font-size="24" font-weight="700" fill="#F3EFE6">Backend</text>
<text x="645" y="138" class="mono" font-size="14" fill="#F3EFE6" fill-opacity=".8">Node, Express</text>
<text x="645" y="162" class="mono" font-size="14" fill="#F3EFE6" fill-opacity=".8">MongoDB</text>
<text x="645" y="186" class="mono" font-size="14" fill="#F3EFE6" fill-opacity=".8">Firebase</text>
<rect x="915" y="70" width="240" height="140" rx="8" fill="#0A1E34" stroke="#5CE1E6" stroke-width="2"/>
<text x="935" y="108" class="serif" font-size="24" font-weight="700" fill="#F3EFE6">Interface</text>
<text x="935" y="138" class="mono" font-size="14" fill="#F3EFE6" fill-opacity=".8">Next.js, React</text>
<text x="935" y="162" class="mono" font-size="14" fill="#F3EFE6" fill-opacity=".8">TypeScript</text>
<text x="935" y="186" class="mono" font-size="14" fill="#F3EFE6" fill-opacity=".8">Three.js</text>
<path id="s0" d="M285,140 H335" stroke="#D9A441" stroke-width="3" fill="none"/>
<circle class="pulse" r="4.5" fill="#5CE1E6" opacity="0"><animateMotion dur="3s" begin="0.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.25;1" calcMode="linear"><mpath href="#s0"/></animateMotion><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle>
<path id="s1" d="M575,140 H625" stroke="#D9A441" stroke-width="3" fill="none"/>
<circle class="pulse" r="4.5" fill="#5CE1E6" opacity="0"><animateMotion dur="3s" begin="0.75s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.25;1" calcMode="linear"><mpath href="#s1"/></animateMotion><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" dur="3s" begin="0.75s" repeatCount="indefinite"/></circle>
<path id="s2" d="M865,140 H915" stroke="#D9A441" stroke-width="3" fill="none"/>
<circle class="pulse" r="4.5" fill="#5CE1E6" opacity="0"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.25;1" calcMode="linear"><mpath href="#s2"/></animateMotion><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
</svg>